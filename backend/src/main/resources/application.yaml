server:
  port: 8080

spring:
  application:
    name: UrlShortener

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

url-shortener:
  base-url: http://localhost:8080
  short-code:
    length: 6
    max-attempts: 10
  rate-limit:
    max-requests-per-minute: 2
    max-requests-per-hour: 10
    max-minute-window: 1m
    max-hour-window: 1h
  cache:
    ttl-minutes: 30
  cleanup:
    interval-minutes: 5
    expired-urls-batch-size: 100
